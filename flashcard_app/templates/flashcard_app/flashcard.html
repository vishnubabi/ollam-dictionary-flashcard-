{% include "sidebar.html" %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minimalist Flashcard</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Your custom CSS -->
  <link rel="stylesheet" href="{% static 'flashcard_app/style.css' %}">
</head>
<body>
  <div class="flashcard-container">
    {% if current_flashcard %}
    <div class="card" id="card">
      <!-- Front -->
      <div class="card-face card-front" id="card-front">
        <div class="question" id="question-text">{{ current_flashcard.english_word }}</div>
        <div class="card-buttons" id="front-buttons">
          <button id="show-btn" type="button">Show Result</button>
        </div>
      </div>
      <!-- Back -->
      <div class="card-face card-back" id="card-back">
        <div class="answer" id="answer-text">{{ current_flashcard.malayalam_meaning }}</div>
        <div class="card-buttons multi-buttons" id="back-buttons" style="display:none;">
          <button type="button" onclick="window.location.reload()">Again</button>
          <button type="button" onclick="window.location.reload()">Hard</button>
          <button type="button" onclick="window.location.reload()">Medium</button>
          <button type="button" onclick="window.location.reload()">Easy</button>
        </div>
      </div>
    </div>
    {% else %}
    <div class="card">
      <div class="card-face card-front">
        <div class="question">No flashcards available. Add some words from the dictionary first!</div>
        <div class="card-buttons">
          <a href="{% url 'dictionary_list' %}" class="btn btn-primary">Go to Dictionary</a>
        </div>
      </div>
    </div>
    {% endif %}
  </div>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'flashcard_app/script.js' %}"></script>
</body>
</html>
