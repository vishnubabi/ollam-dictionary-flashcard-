{% load static %}
<link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

<div class="sidebar" id="sidebar">
    <!-- Mobile Toggle Button -->
    <button class="sidebar-toggle d-md-none" id="sidebarToggle">
        <i class="bi bi-list"></i>
    </button>
    
    <!-- Logo/Brand -->
    <div class="sidebar-brand mb-4">
        <h4 class="text-primary fw-bold">
            <i class="bi bi-translate me-2"></i>
            MalayDict
        </h4>
    </div>

    <!-- Profile Section -->
    {% if request.user.is_authenticated %}
    <div class="profile-section mb-3 text-center">
        <div class="small mb-2">Signed in as</div>
        <div class="fw-bold">{{ request.user.username }}</div>
    </div>
    <form method="post" action="{% url 'logout' %}" class="mt-3">
        {% csrf_token %}
        <button class="btn btn-secondary w-100" type="submit">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
    </form>
{% else %}
    <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 mb-2">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
    </a>
    <a href="{% url 'signup' %}" class="btn btn-primary w-100">
        <i class="bi bi-person-plus me-1"></i> Sign Up
    </a>
{% endif %}

    <!-- Navigation -->
    <nav class="sidebar-nav">
        <a href="#" class="nav-item">
            <i class="bi bi-house-door"></i>
            <span>Home</span>
        </a>
        <a href="{% url 'dictionary_list' %}" class="nav-item">
            <i class="bi bi-book"></i>
            <span>Dictionary</span>
        </a>
        <a href="{% url 'flashcard_home' %}" class="nav-item">
            <i class="bi bi-card-text"></i>
            <span>Flashcards</span>
        </a>
        <a href="#" class="nav-item">
            <i class="bi bi-person"></i>
            <span>Account</span>
        </a>
        <a href="#" class="nav-item">
            <i class="bi bi-gear"></i>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Dark Mode Toggle -->
    <div class="dark-mode-section mt-auto">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="darkModeToggle">
            <label class="form-check-label" for="darkModeToggle">
                <i class="bi bi-moon me-2"></i>Dark Mode
            </label>
        </div>
    </div>
</div>

<!-- Mobile Overlay -->
<div class="sidebar-overlay d-md-none" id="sidebarOverlay"></div>

<!-- Include the separate sidebar JavaScript -->
<script src="{% static 'js/sidebar.js' %}"></script>
